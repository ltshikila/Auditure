<!DOCTYPE html>
<html>
<head>
    <title>Database Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .section { margin: 30px 0; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <h1>Auditure Database Viewer</h1>
    <div id="content">Loading...</div>

    <script>
        fetch('http://localhost:3000/api/db-view')
            .then(res => res.json())
            .then(data => {
                let html = '';

                // Users
                html += '<div class="section"><h2>Users (' + data.users.length + ')</h2>';
                if (data.users.length > 0) {
                    html += '<table><tr><th>ID</th><th>Email</th><th>Name</th><th>Verified</th><th>Books</th></tr>';
                    data.users.forEach(u => {
                        html += `<tr><td>${u.id}</td><td>${u.email}</td><td>${u.firstName} ${u.lastName}</td><td>${u.isEmailVerified}</td><td>${u._count.books}</td></tr>`;
                    });
                    html += '</table>';
                } else {
                    html += '<p>No users found</p>';
                }
                html += '</div>';

                // Books
                html += '<div class="section"><h2>Books (' + data.books.length + ')</h2>';
                if (data.books.length > 0) {
                    html += '<table><tr><th>Title</th><th>Author</th><th>Status</th><th>Chapters</th></tr>';
                    data.books.forEach(b => {
                        html += `<tr><td>${b.title}</td><td>${b.author || 'N/A'}</td><td>${b.extractionStatus}</td><td>${b._count.chapters}</td></tr>`;
                    });
                    html += '</table>';
                } else {
                    html += '<p>No books found</p>';
                }
                html += '</div>';

                document.getElementById('content').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<p style="color: red;">Error: ' + err.message + '</p>';
            });
    </script>
</body>
</html>
