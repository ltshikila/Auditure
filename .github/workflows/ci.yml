name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-test-core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  lint-and-test-ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check src/ || echo "Lint warnings found"

      - name: Run tests
        continue-on-error: true
        run: pytest --tb=short || echo "Some tests failed"

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [lint-and-test-core-api, lint-and-test-ai-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Build Core API Docker image
        working-directory: services/core-api
        run: docker build -t core-api:test .

      - name: Build AI Worker Docker image
        working-directory: services/ai-worker
        run: docker build -t ai-worker:test .
