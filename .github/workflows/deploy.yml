name: Deploy to GCP

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  PROJECT_ID: auditure-483611
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  # Run tests for both services
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Core API
        working-directory: services/core-api
        continue-on-error: true
        run: |
          npm install
          npx prisma generate
          npm test || echo "Core API tests failed but continuing deployment"

      - name: Test AI Worker
        working-directory: services/ai-worker
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
          pytest --tb=short || echo "AI Worker tests failed but continuing deployment"

  # Build and deploy Core API
  deploy-core-api:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Core API image
        working-directory: services/core-api
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:latest .
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy core-api \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars "NODE_ENV=production,STORAGE_BACKEND=gcs,GCS_BUCKET_NAME=auditure-storage-prod,REDIS_HOST=10.3.19.75,REDIS_PORT=6379,PAYSTACK_PLAN_CODE_STARTER=PLN_xm7trebza6clbu9,PAYSTACK_PLAN_CODE_PRO=PLN_9gsbdjplzsh2kze,PAYSTACK_PUBLIC_KEY=pk_live_8f93ef4b485aaf14b74e1ad517ca0e277dd88368,EMAIL_LOGO_URL=https://storage.googleapis.com/auditure-storage-prod/branding/logo_1_hd.png,MOBILE_APP_SCHEME=auditure,APP_URL=https://api.auditure.app,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},BOOK_EXTRACTOR_JOB_NAME=book-extractor" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,PAYSTACK_SECRET_KEY=PAYSTACK_SECRET_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RABBITMQ_URL=RABBITMQ_URL:latest,SENTRY_DSN=SENTRY_DSN:latest,EXPO_ACCESS_TOKEN=EXPO_ACCESS_TOKEN:latest,POSTHOG_API_KEY=POSTHOG_API_KEY:latest,REVENUECAT_WEBHOOK_AUTH_HEADER=REVENUECAT_WEBHOOK_AUTH_HEADER:latest" \
            --add-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:auditure-db \
            --vpc-connector projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/connectors/auditure-connector \
            --vpc-egress private-ranges-only \
            --cpu-throttling \
            --min-instances 0 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300

      # Deploy the book-extractor Cloud Run Job (same image, different command)
      # This runs book extraction work that needs to survive container lifecycle.
      # `deploy` creates the Job if missing, updates it otherwise.
      - name: Deploy book-extractor Cloud Run Job
        run: |
          gcloud run jobs deploy book-extractor \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --command node \
            --args dist/src/book-extractor-main.js \
            --set-env-vars "NODE_ENV=production,STORAGE_BACKEND=gcs,GCS_BUCKET_NAME=auditure-storage-prod,REDIS_HOST=10.3.19.75,REDIS_PORT=6379,EMAIL_LOGO_URL=https://storage.googleapis.com/auditure-storage-prod/branding/logo_1_hd.png,JOB_MAX_RETRIES=3" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,RABBITMQ_URL=RABBITMQ_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,EXPO_ACCESS_TOKEN=EXPO_ACCESS_TOKEN:latest" \
            --set-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:auditure-db \
            --vpc-connector projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/connectors/auditure-connector \
            --vpc-egress private-ranges-only \
            --memory 2Gi \
            --cpu 2 \
            --task-timeout 3600 \
            --max-retries 3 \
            --parallelism 1 \
            --tasks 1

  # Build and deploy AI Worker
  deploy-ai-worker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push AI Worker image
        working-directory: services/ai-worker
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:latest .
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ai-worker \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --set-env-vars "STORAGE_BACKEND=gcs,GCS_BUCKET_NAME=auditure-storage-prod,REDIS_HOST=10.3.19.75,REDIS_PORT=6379" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,RABBITMQ_URL=RABBITMQ_URL:latest" \
            --add-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:auditure-db \
            --vpc-connector projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/connectors/auditure-connector \
            --vpc-egress private-ranges-only \
            --no-cpu-throttling \
            --min-instances 1 \
            --max-instances 5 \
            --memory 2Gi \
            --cpu 1 \
            --timeout 900

  # Run database migrations after deployment
  migrate:
    needs: deploy-core-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Run Prisma migrations
        working-directory: services/core-api
        run: |
          npm install
          npx prisma generate

          # Start Cloud SQL Auth Proxy in background (proxy is in repo root, 2 levels up)
          ../../cloud-sql-proxy --port 5432 ${{ env.PROJECT_ID }}:${{ env.REGION }}:auditure-db &
          sleep 5

          # Get database credentials from Secret Manager and construct direct connection URL
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
          # Extract password from the URL and construct localhost connection
          DB_PASS=$(echo "$DB_URL" | sed -n 's/.*:\/\/[^:]*:\([^@]*\)@.*/\1/p')
          export DATABASE_URL="postgresql://auditure_user:${DB_PASS}@localhost:5432/auditure_prod"

          # Resolve any previously failed migrations so they can be re-applied
          npx prisma migrate resolve --rolled-back 20260207000000_add_episode_likes_and_notification_types 2>/dev/null || true
          npx prisma migrate resolve --rolled-back 20260209000000_add_episode_downloads 2>/dev/null || true

          npx prisma migrate deploy
