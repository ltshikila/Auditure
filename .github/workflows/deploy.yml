name: Deploy to GCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: auditure-prod
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  # Run tests for both services
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/core-api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-worker/requirements.txt

      - name: Test Core API
        working-directory: services/core-api
        run: |
          npm ci
          npm test

      - name: Test AI Worker
        working-directory: services/ai-worker
        run: |
          pip install -r requirements.txt
          pytest

  # Build and deploy Core API
  deploy-core-api:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Core API image
        working-directory: services/core-api
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:latest .
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy core-api \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/core-api:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,PAYSTACK_SECRET_KEY=PAYSTACK_SECRET_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RABBITMQ_URL=RABBITMQ_URL:latest,REDIS_HOST=REDIS_HOST:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300

  # Build and deploy AI Worker
  deploy-ai-worker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push AI Worker image
        working-directory: services/ai-worker
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:latest .
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ai-worker \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/auditure/ai-worker:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,RABBITMQ_URL=RABBITMQ_URL:latest,REDIS_HOST=REDIS_HOST:latest" \
            --min-instances 0 \
            --max-instances 5 \
            --memory 2Gi \
            --cpu 1 \
            --timeout 900

  # Run database migrations after deployment
  migrate:
    needs: deploy-core-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Prisma migrations
        working-directory: services/core-api
        run: |
          npm ci
          npx prisma generate
          # Get database URL from Secret Manager
          export DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
          npx prisma migrate deploy
